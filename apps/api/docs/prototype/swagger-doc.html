<script>
window.onload = function() {

  var spec = {"openapi": "3.0.4", "info": {"title": "Prototype API", "description": "This is a draft proposed API footprint for new AssetPlus API endpoints, created solely to make it easier to discuss the current recommended user flow with stakeholders. It is not intended to be a final specification, and should not be used as a reference for implementation.\n\n> **\u26a0\ufe0f Please note that this spec is an illustrative draft of pseudocode, not a final spec.**\n\nSome commons terms will be used here that might not be familiar to all readers:\n\n- YPID: YJAF Young Person Identifier, the unique identifier for a child within AssetPlus. This is a numeric string and is currently the identifier that will be used to discuss AssetPlus stages for a child.\n- CYPID: Current Young Person Identifier, the current unique identifier for the child within a local authority's CMS. When used in an API, this must be provided as an uncertain OYPID (see below) with a 2-letter YJS code attached.\n- OYPID: Original Young Person Identifier, the original unique identifier for the child within a local authority's CMS plus a 2-letter YJS code. This is a unique identifier across Youth Justice, reflecting the first CYPID that was allocated to a child and a note of which local authority allocated it.\n\n  This ID allows the linking of records of children who move between YJSs or have looked-after status placed out of area and assign data to the YJS or local authority responsible for them at different times.\n\n  - When the OYPID is known for certain, it will be a CYPID, a local authority code and `-LAC`, for example `111AZ-AA-LAC`, where `111AZ` is the CYPID and `AA` is the local authority code.\n  - When the OYPID is uncertain, it will be a CYPID and a local authority code, without the `-LAC` suffix, for example `111AZ-AA`, where `111AZ` is the CYPID and `AA` is the local authority code.\n  - When the OYPID and the local authority are unknown, it will be a CYPID and a local authority code of `XX`. This allows for searching when a CYPID is known but the originating local authority is not.\n- SUI: A \u201cSingle Unique Identifier\u201d or \u201cConsistent Identifier\u201d, a unique identifier for children in the UK, as provided for in [section 16LC of the Children Act 2004](https://www.legislation.gov.uk/ukpga/2004/31/section/16LC), as amended by [section 4 of the Children's Wellbeing and Schools Act 2026](https://www.legislation.gov.uk/ukpga/2026/21/section/4). This is likely to be a child\u2019s NHS Number\n- PNCID: Police National Computer identifier, in the format `YYYY/NNNNNNNA`, where `YYYY` is the year the individual was first recorded for an offence and `NNNNNNN` is a 7-digit serial part and `A` is a letter. Example: `2024/0236206A`. The dummy value `0000/0000000A` will lead to a 400 Bad Request response from any API here. In `GET` requests, the slash must be URL-encoded as `%2F`, for example `2024%2F0236206A`.\n\nIt might also be useful for readers to be familiar with the [Person Standard](https://github.com/SocialCareData/person-standard) from [Data Standards for Social Care](https://github.com/SocialCareData/person-standard), sponsored by the Department for Education and the Department of Health and Social Care.\n", "version": "0.0.2"}, "servers": [], "tags": [{"name": "Reviewed", "description": "New API methods that should be correct for v0.0.2"}, {"name": "Not yet reviewed", "description": "New API methods with WIP details, containing leftovers from v0.0.1"}, {"name": "Existing workflows", "description": "Stub methods representing workflows that exist in the current AssetPlus processes"}], "paths": {"/children": {"get": {"summary": "Retrieve a child's record from AssetPlus, providing at least one identifier (OYPID, SUI or PNCID) or providing search parameters (name, date of birth and address)", "tags": ["Reviewed"], "description": "This endpoint retrieves a child's record from AssetPlus, providing at least one identifier (OYPID, SUI or PNCID) or providing search parameters (name, date of birth and address). The response will be an array of `MinimalChild` objects, which may be empty if no matching records are found.\n\n **Note:** Several parameters here contain personally-identifiable information and should not be sent in the querystring. If passing any of the following parameters, use the `X-Parameters` header instead, or use a `POST` request to `/children/search` with the same parameters in the request body. This applies to `family_name`, `given_names`, `date_of_birth` and `postcode`. If any of these parameters is sent in the querystring, a `405 Method Not Allowed` response will be returned.\n \n The `X-Parameters` header should accept either key/value pairs or JSON, for example:\n \n ```text\n X-Parameters: family_name=Smith, given_names=Michael Talal, date_of_birth=2012-11-24, postcode=SW1A 0AA\n ```\n \n or\n \n ```json\n X-Parameters: { \"family_name\": \"Smith\", \"given_names\": [ \"Michael\", \"Talal\" ], \"date_of_birth\": \"2012-11-24\", \"postcode\": \"SW1A 0AA\" }\n ```\n \n Optional whitespace between or within values will be ignored. `family_name =\u00a0\u00a0\u00a0Smith,\u00a0\u00a0\u00a0\u00a0\u00a0given_names\u00a0\u00a0=Michael\u00a0\u00a0\u00a0Talal` will be treated exactly the same as `family_name=Smith,given_names=Michael Talal`.\n", "parameters": [{"name": "oypid", "in": "query", "schema": {"type": "string"}, "description": "An Original Young Person Identifier (OYPID) of the child."}, {"name": "sui", "in": "query", "schema": {"type": "string"}, "description": "The Single Unique Identifier (SUI) of the child."}, {"name": "pncid", "in": "query", "schema": {"type": "string"}, "description": "The Police National Computer identifier (PNCID) of the child."}, {"$ref": "#/components/parameters/familyNameHeaderParameter"}, {"$ref": "#/components/parameters/givenNamesHeaderParameter"}, {"$ref": "#/components/parameters/dobHeaderParameter"}, {"$ref": "#/components/parameters/dobAccuracyHeaderParameter"}, {"$ref": "#/components/parameters/postcodeHeaderParameter", "in": "header", "schema": {"type": "string"}, "description": "The postal code of the child's address. **Note:** This is personally-identifiable information and should not be sent in the querystring. Use the `X-Parameters` header instead, or use a `POST` request to `/children/search` with the same parameters in the request body."}], "responses": {"200": {"description": "Success response (existing child)\n\nFor a child who is already known to the system, this will return a complete `CompleteChild` object, with as many or as few properties as are known to the server.\n\nNote that a _new_ child will give a different response, with only a `MinimalChild`, which is expected to be the more common response.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CompleteChild"}}}}, "201": {"description": "Success response (new child)\n\nFor a new child, this will return the same `MinimalChild` object, with as many or as few properties as was supplied in the request.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MinimalChild"}}}}, "400": {"description": "Bad request\n\nThe request body was invalid, for example if it did not include a `MinimalChild` object, or if the `MinimalChild` object did not include at least one identifier (OYPID, SUI or PNCID).\n\nAlternatively, some other unexpected error was found in the request data.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "405": {"description": "Method Not Allowed\n\nThe request included personally-identifying information fields (one or more of `family_name`, `given_names`, `date_of_birth` and `postcode`) in the querystring.\n\nEither reissue the request using the HTTP header `X-Parameters` for those fields or instead `POST` the request to /children/search\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "409": {"description": "Conflict\n\nThe request format was valid, but identifiers in the request body conflicted with existing records in the system. For example, if a child with the same OYPID already exists, but the SUI or PNCID provided in the request body does not match that existing record. Another example might be if more than one identifier (or an identifier and name, address or DOB) was provided in the request body, and those details do not match \u2014 the identifier corresponds to a different child from the biographical details or the multiple identifiers correspond to different children.\n\nAn error response is provided here, but no information will be provided about the children identified by the conflicting request details.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "500": {"description": "Internal server error\n\nAn unexpected error occurred on the server. The request may have been valid, but the server was unable to process it.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}}}, "put": {"summary": "Create a new child in AssetPlus, in order to subsequently create Stages\n\nThe `ypid` in the `MinimalChild` object in the request body must be null or zero. Any other value will be disregarded.\n\nTODO: Needs review and other responses\n", "tags": ["Not yet reviewed"], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "$ref": "#/components/schemas/MinimalChild"}}}}, "responses": {"200": {"description": "Successful response", "content": {"application/json": {"schema": {"type": "object", "properties": {"ypid": {"type": "integer", "minimum": 1, "maximum": 999999999}}}}}}}}}, "/children/search": {"post": {"summary": "Search for a child's record from AssetPlus, providing at least one identifier (OYPID, SUI or PNCID) or providing search parameters (name, date of birth and address)", "tags": ["Reviewed"], "description UK Core [Person.dateOfBirth](https://www.datadictionary.nhs.uk/data_elements/person_date_of_birth.html) data element.\n"}, "postcode": {"type": "string", "description": "The postal code of the child's address."}}}}}}, "responses": {"200": {"description": "OK: Success response (existing child)\n\nFor a child who is already known to the system, this will return a complete `CompleteChild` object, with as many or as few properties as are known to the server.\n\nNote that a _new_ child will give a different response, with a 201 Created header and only a `MinimalChild`, which is expected to be the more common response.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CompleteChild"}}}}, "201": {"description": "Created: Success response (new child)\n\nFor a new child, this will return the same `MinimalChild` object, with as many or as few properties as was supplied in the request.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MinimalChild"}}}}, "400": {"description": "Bad request\n\nThe request body was invalid, for example if it did not include a `MinimalChild` object, or if the `MinimalChild` object did not include at least one identifier (OYPID, SUI or PNCID).\n\nAlternatively, some other unexpected error was found in the request data.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "409": {"description": "Conflict\n\nThe request format was valid, but identifiers in the request body conflicted with existing records in the system. For example, if a child with the same CYPID already exists, but the SUI or PNCID provided in the request body does not match that existing record. Another example might be if more than one identifier (or an identifier and name, address or DOB) was provided in the request body, and those details do not match \u2014 the identifier corresponds to a different child from the biographical details or the multiple identifiers correspond to different children.\n\nAn error response is provided here, but no information will be provided about the children identified by the conflicting request details.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "500": {"description": "Internal server error\n\nAn unexpected error occurred on the server. The request may have been valid, but the server was unable to process it.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}}}}, "/children/{ypid}/": {"get": {"summary": "Fetch the full AssetPlus data packet for the given child\n\nTODO: Needs other response types\n", "tags": ["Existing workflows"], "parameters": [{"$ref": "#/components/parameters/ypidParameter"}], "responses": {"200": {"description": "Successful response", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/Stage"}}}}}}}}, "/children/{ypid}/stages/": {"get": {"summary": "Fetch all Stages for the given child\n\nTODO: Needs other response types; check the 200 response makes sense\n", "tags": ["Existing workflows"], "parameters": [{"$ref": "#/components/parameters/ypidParameter"}], "responses": {"200": {"description": "Successful response", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/Stage"}}}}}}}, "post": {"summary": "Create a new AssetPlus Stage", "tags": ["Not yet reviewed"], "description": "This endpoint creates a new AssetPlus record-stub. The request body must include the base demographic information to be able to disambiguate a child \u2014 either a OYPID or a SUI. The response will include a unique AssetPlus record identifier, which can be used to retrieve or update the record in subsequent API calls.\n", "parameters": [{"$ref": "#/components/parameters/ypidParameter"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "properties": {"child": {"$ref": "#/components/schemas/MinimalChild"}}}}}}, "responses": {"200": {"description": "Success response (existing child)\n\nFor a child who is already known to the system, this will return a complete `FullChild` object, with as many or as few properties as are known to the server.\n\nNote that a _new_ child will give a different response, with only a `CompleteChild`, which is expected to be the more common response.\n\nAs clients might struggle to accept a `201 Created` response, clients should validate whether a `200 OK` response contains only the `MinimalChild` submitted in the request or a more complete `CompleteChild`.\n", "content": {"application/json": {"schema": {"type": "integer", "minimum": 1, "description": "The internal identifier for an AssetPlus Stage"}}}}, "201": {"description": "Success response (new child)\n\nFor a new child, this will return the same `MinimalChild` object, with as many or as few properties as was supplied in the request.\n\n*Note:* We might send a `200 OK` header for this response in future, if clients struggle to accept a `201 Created`.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MinimalChild"}}}}, "400": {"description": "Bad request\n\nThe request body was invalid, for example if it did not include a `MinimalChild` object, or if the `MinimalChild` object did not include at least one identifier (OYPID, SUI or PNCID).\n\nAlternatively, some other unexpected error was found in the request data.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "405": {"description": "Method Not Allowed\n\nThe request included personally-identifying information fields (one or more of `family_name`, `given_names`, `date_of_birth` and `postcode`) in the querystring.\n\nEither reissue the request using the HTTP header `X-Parameters` for those fields\n"}, "409": {"description": "Conflict\n\nThe request format was valid, but identifiers in the request body conflicted with existing records in the system. For example, if a child with the same CYPID already exists, but the SUI or PNCID provided in the request body does not match that existing record. Another example might be if more than one identifier (or an identifier and name, address or DOB) was provided in the request body, and those details do not match \u2014 the identifier corresponds to a different child from the biographical details or the multiple identifiers correspond to different children.\n\nAn error response is provided here, but no information will be provided about the children identified by the conflicting request details.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "500": {"description": "Internal server error\n\nAn unexpected error occurred on the server. The request may have been valid, but the server was unable to process it.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}}}}, "/children/{ypid}/stages/{stageid}": {"parameters": [{"$ref": "#/components/parameters/ypidParameter"}, {"$ref": "#/components/parameters/stageidParameter"}], "get": {"tags": ["Not yet reviewed"], "summary": "Fetch an AssetPlus Stage (or partial Stage)", "description": "This endpoint retrieves an existing AssetPlus Stage, which may be a full Stage or a partial Stage.", "responses": {"200": {"description": "Success response, including the requested Stage, including a `MinimalChild` object, which must be used to confirm that the response relates to the expected child.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Stage", "minimumItems": 1, "maximumItems": 1}}}}, "400": {"description": "Bad Request\n\nSome unexpected error occurred with the request data, unrelated to any mismatch between the child and the `stageid`.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "404": {"description": "Not Found\n\nThe provided `stageid` does not exist or is not associated with the child corresponding to the given `ypid`. Alternatively, if a `X-Parameters` header was provided, either the details therewithin did not correspond to the provided `ypid`.\n\nFor the sake of security, the server will not specify which of these conditions is the case in the error response.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "500": {"description": "Internal server error\n\nAn unexpected error occurred on the server. The request may have been valid, but the server was unable to process it.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}}}, "patch": {"tags": ["Not yet reviewed"], "summary": "Save a partial update to an existing AssetPlus Stage", "description": "This endpoint saves a partial update to an existing AssetPlus record. The request body must include at least one property to update. The response will just be an acknowledgement of the update, with no content, or an error response.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "properties": {"stage": {"$ref": "#/components/schemas/Stage"}}}}}}, "responses": {"200": {"description": "Success response, optionally containing a notification message saying that someone else also has a partial Stage open for this child.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Notification", "minimumItems": 0, "maximumItems": 1}}}}, "400": {"description": "Bad request\n\nThe request body was invalid, for example if it did not include a `MinimalChild` object, or if the `MinimalChild` object did not include at least one identifier (CYPID, SUI or PNCID).\n\nAlternatively, some other unexpected error was found in the request data.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "409": {"description": "Conflict\n\nThe request format was valid, but identifiers in the request conflicted with existing records in the system. For example, if a child with the same OYPID already exists, but the SUI or PNCID provided in the request body does not match that existing record. Another example might be if more than one identifier (or an identifier and name, address or DOB) was provided in the request body, and those details do not match \u2014 the identifier corresponds to a different child from the biographical details or the multiple identifiers correspond to different children.\n\nAn error response is provided here, but no information will be provided about the children identified by the conflicting request details.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "500": {"description": "Internal server error\n\nAn unexpected error occurred on the server. The request may have been valid, but the server was unable to process it.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}}}, "put": {"tags": ["Not yet reviewed"], "summary": "Save a complete update to an existing AssetPlus record", "description": "This endpoint saves a complete update to an existing AssetPlus record. The request body must include the unique AssetPlus record identifier, and all properties to update.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "properties": {"stage": {"$ref": "#/components/schemas/Stage"}}}}}}, "responses": {"200": {"description": "Success response"}, "400": {"description": "Bad request\n\nThe request body was invalid, for example if it did not include a `MinimalChild` object, or if the `MinimalChild` object did not include at least one identifier (CYPID, SUI or PNCID).\n\nAlternatively, some other unexpected error was found in the request data.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "409": {"description": "Conflict\n\nThe request format
