<script>
window.onload = function() {

  var spec = {"openapi": "3.0.4", "info": {"title": "Prototype API", "description": "This is a draft proposed API footprint for new AssetPlus API endpoints, created solely to make it easier to discuss the current recommended user flow with stakeholders. It is not intended to be a final specification, and should not be used as a reference for implementation.\n\n> **\u26a0\ufe0f Please note that this spec is an illustrative draft of pseudocode, not a final spec.**\n\nSome commons terms will be used here that might not be familiar to all readers:\n\n- YPID: YJAF Young Person Identifier, the unique identifier for a child within AssetPlus. This is a numeric string and is currently the identifier that will be used to discuss AssetPlus stages for a child.\n- CYPID: Current Young Person Identifier, the current unique identifier for the child within a local authority's CMS. When used in an API, this must be provided as an uncertain OYPID (see below) with a 2-letter YJS code attached.\n- OYPID: Original Young Person Identifier, the original unique identifier for the child within a local authority's CMS plus a 2-letter YJS code. This is a unique identifier across Youth Justice, reflecting the first CYPID that was allocated to a child and a note of which local authority allocated it.\n\n  This ID allows the linking of records of children who move between YJSs or have looked-after status placed out of area and assign data to the YJS or local authority responsible for them at different times.\n\n  - When the OYPID is known for certain, it will be a CYPID, a local authority code and `-LAC`, for example `111AZ-AA-LAC`, where `111AZ` is the CYPID and `AA` is the local authority code.\n  - When the OYPID is uncertain, it will be a CYPID and a local authority code, without the `-LAC` suffix, for example `111AZ-AA`, where `111AZ` is the CYPID and `AA` is the local authority code.\n  - When the OYPID and the local authority are unknown, it will be a CYPID and a local authority code of `XX`. This allows for searching when a CYPID is known but the originating local authority is not.\n- SUI: A \u201cSingle Unique Identifier\u201d or \u201cConsistent Identifier\u201d, a unique identifier for children in the UK, as provided for in [section 16LC of the Children Act 2004](https://www.legislation.gov.uk/ukpga/2004/31/section/16LC), as amended by [section 4 of the Children's Wellbeing and Schools Act 2026](https://www.legislation.gov.uk/ukpga/2026/21/section/4). This is likely to be a child\u2019s NHS Number\n- PNCID: Police National Computer identifier, in the format `YYYY/NNNNNNNA`, where `YYYY` is the year the individual was first recorded for an offence and `NNNNNNN` is a 7-digit serial part and `A` is a letter. Example: `2024/0236206A`. The dummy value `0000/0000000A` will lead to a 400 Bad Request response from any API here. In `GET` requests, the slash must be URL-encoded as `%2F`, for example `2024%2F0236206A`.\n\nIt might also be useful for readers to be familiar with the [Person Standard](https://github.com/SocialCareData/person-standard) from [Data Standards for Social Care](https://github.com/SocialCareData/person-standard), sponsored by the Department for Education and the Department of Health and Social Care.\n", "version": "0.0.2"}, "servers": [], "tags": [{"name": "Find and create children", "description": "Find and create children in AssetPlus, using identifiers or biographical details"}, {"name": "Find, create and update Stages", "description": "Find, create and update Stages for children in AssetPlus"}], "paths": {"/children": {"get": {"summary": "Search for a child's record from AssetPlus, either from an identifier or from biographical details", "tags": ["Find and create children"], "description": "This endpoint retrieves a child's record from AssetPlus, providing at least one identifier (OYPID, SUI or PNCID) or providing search parameters (name, date of birth and address). The response will be an array of `CompleteChild` objects, which may be empty if no matching records are found.\n\n**Note:** Several parameters here contain personally-identifiable information and should not be sent in the querystring. If passing any of the following parameters, use the `X-Parameters` header instead, or use a `POST` request to `/children/search` with the same parameters in the request body. This applies to `family_name`, `given_names`, `date_of_birth` and `postcode`. If any of these parameters is sent in the querystring, a `405 Method Not Allowed` response will be returned. Repeated requests with personally-identifiable information in the querystring will be logged and may result in the client being blocked from the API.\n\nThe `X-Parameters` header should accept either key/value pairs or JSON, for example:\n\n```text\nX-Parameters: family_name=Smith, given_names=Michael Talal, date_of_birth=2012-11-24, postcode=SW1A 0AA\n```\n\nor\n\n```json\nX-Parameters: { \"family_name\": \"Smith\", \"given_names\": [ \"Michael\", \"Talal\" ], \"date_of_birth\": \"2012-11-24\", \"postcode\": \"SW1A 0AA\" }\n```\n\nOptional whitespace between or within values will be ignored. `family_name =\u00a0\u00a0\u00a0Smith,\u00a0\u00a0\u00a0\u00a0\u00a0given_names\u00a0\u00a0=Michael\u00a0\u00a0\u00a0Talal` will be treated exactly the same as `family_name=Smith,given_names=Michael Talal`.\n", "parameters": [{"name": "oypid", "in": "query", "schema": {"type": "string"}, "description": "An Original Young Person Identifier (OYPID) of the child."}, {"name": "sui", "in": "query", "schema": {"type": "string"}, "description": "The Single Unique Identifier (SUI) of the child."}, {"name": "pncid", "in": "query", "schema": {"type": "string"}, "description": "The Police National Computer identifier (PNCID) of the child."}, {"$ref": "#/components/parameters/familyNameHeaderParameter"}, {"$ref": "#/components/parameters/givenNamesHeaderParameter"}, {"$ref": "#/components/parameters/dobHeaderParameter"}, {"$ref": "#/components/parameters/dobAccuracyHeaderParameter"}, {"$ref": "#/components/parameters/postcodeHeaderParameter", "in": "header", "schema": {"type": "string"}, "description": "The postal code of the child's address. **Note:** This is personally-identifiable information and should not be sent in the querystring. Use the `X-Parameters` header instead, or use a `POST` request to `/children/search` with the same parameters in the request body."}], "responses": {"200": {"description": "Success response (existing child)\n\nFor a child who is already known to the system, this will return a complete `CompleteChild` object, with as many or as few properties as are known to the server.\n\nNote that a _new_ child will give a different response, with only a `MinimalChild`, which is expected to be the more common response.\n", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/CompleteChild"}}}}}, "400": {"description": "Bad request\n\nThe request body was invalid, for example if it did not include a `MinimalChild` object, or if the `MinimalChild` object did not include at least one identifier (OYPID, SUI or PNCID).\n\nAlternatively, some other unexpected error was found in the request data.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "405": {"description": "Method Not Allowed\n\nThe request included personally-identifying information fields (one or more of `family_name`, `given_names`, `date_of_birth` and `postcode`) in the querystring.\n\nEither reissue the request using the HTTP header `X-Parameters` for those fields or instead `POST` the request to /children/search\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "409": {"description": "Conflict\n\nThe request format was valid, but identifiers in the request body conflicted with existing records in the system. For example, if a child with the same OYPID already exists, but the SUI or PNCID provided in the request body does not match that existing record. Another example might be if more than one identifier (or an identifier and name, address or DOB) was provided in the request body, and those details do not match \u2014 the identifier corresponds to a different child from the biographical details or the multiple identifiers correspond to different children.\n\nAn error response is provided here, but no information will be provided about the children identified by the conflicting request details.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "500": {"description": "Internal server error\n\nAn unexpected error occurred on the server. The request may have been valid, but the server was unable to process it.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}}}, "post": {"summary": "Create a new child in AssetPlus, in order to subsequently create Stages", "tags": ["Find and create children"], "description": "Create a new child in AssetPlus, in order to subsequently create Stages\n\nThe `ypid` in the `MinimalChild` object in the request body must be null or zero. Any other value will be disregarded.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "$ref": "#/components/schemas/MinimalChild"}}}}, "responses": {"200": {"description": "Successful response", "content": {"application/json": {"schema": {"type": "object", "properties": {"ypid": {"type": "integer", "minimum": 1, "maximum": 999999999}, "identifier_array": {"type": "object", "$ref": "#/components/schemas/IdentifierArray"}}}}}}, "400": {"description": "Bad request\n\nThe request body was invalid, for example if it did not include a `MinimalChild` object, or if the `MinimalChild` object contained a non-null `ypid`.\n\nAlternatively, some other unexpected error was found in the request data.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "409": {"description": "Conflict\n\nThe request format was valid, but identifiers in the request body conflicted with existing records in the system. For example, if a child with the same OYPID already exists, but the SUI or PNCID provided in the request body does not match that existing record. Another example might be if more than one identifier (or an identifier and name, address or DOB) was provided in the request body, and those details do not match \u2014 the identifier corresponds to a different child from the biographical details or the multiple identifiers correspond to different children.\n\nAn error response is provided here, but no information will be provided about the children identified by the conflicting request details.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "500": {"description": "Internal server error\n\nAn unexpected error occurred on the server. The request may have been valid, but the server was unable to process it.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}}}}, "/children/search": {"post": {"summary": "Search for a child's record from AssetPlus, either from an identifier or from biographical details", "tags": ["Find and create children"], "description": "This endpoint searches for a child's record from AssetPlus, providing at least one identifier (OYPID, SUI or PNCID) or providing search parameters (name, date of birth and address). The response will be an array of `MinimalChild` objects, which may be empty if no matching records are found.\n\nThis end point is fundmentally the same as `GET /children`, but allows personally-identifiable information to be sent in the request body, rather than in the querystring or headers. Equivalent requests to `GET /children` and `POST /children/search` must be idempotent, returning the same results for the same request parameters.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "properties": {"oypid": {"type": "string", "description": "An Original Young Person Identifier (OYPID) of the child."}, "sui": {"type": "string", "description": "The Single Unique Identifier (SUI) of the child."}, "pncid": {"type": "string", "description": "The Police National Computer identifier (PNCID) of the child."}, "family_name": {"type": "string", "description": "The family name (surname) of the child."}, "given_names": {"type": "string", "description": "The given names (first and middle names) of the child."}, "date_of_birth": {"type": "string", "format": "date", "description": "The date of birth of the child, provided as an [ISO 8601](https://www.w3.org/QA/Tips/iso-date) formatted date of birth (`YYYY-MM-DD`)."}, "date_of_birth_accuracy": {"type": "string", "enum": ["AAA", "AAE", "AAU", "AEA", "AEE", "AEU", "AUA", "AUE", "AUU", "EAA", "EAE", "EAU", "EEA", "EEE", "EEU", "EUA", "EUE", "EUU", "UAA", "UAE", "UAU", "UEA", "UEE", "UEU", "UUA", "UUE", "UUU"], "description": "Optionally indicates which parts of the date are known to be accurate (`A`), estimated (`E`) or unknown (`U`).\n\nThis should be provided as a string of three characters, where the first character indicates the accuracy of the day, the second character indicates the accuracy of the month, and the third character indicates the accuracy of the year. For example, `AAU` indicates that the day and month are known to be accurate, but the year is unknown.\n\nThis aligns with the FHIR Extension [\u201cDate Accuracy Indicator\u201d](https://hl7.org/fhir/extension-datetime-accuracy.html), which is used in the FHIR UK Core [Person.dateOfBirth](https://www.datadictionary.nhs.uk/data_elements/person_date_of_birth.html) data element.\n"}, "postcode": {"type": "string", "description": "The postal code of the child's address."}}}}}}, "responses": {"200": {"description": "OK: Success response (existing child)\n\nFor a child who is already known to the system, this will return a complete `CompleteChild` object, with as many or as few properties as are known to the server.\n\nNote that a _new_ child will give a different response, with a 201 Created header and only a `MinimalChild`, which is expected to be the more common response.\n", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/CompleteChild"}}}}}, "400": {"description": "Bad request\n\nThe request body was invalid, for example if it did not include a `MinimalChild` object, or if the `MinimalChild` object did not include at least one identifier (OYPID, SUI or PNCID).\n\nAlternatively, some other unexpected error was found in the request data.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "409": {"description": "Conflict\n\nThe request format was valid, but identifiers in the request body conflicted with existing records in the system. For example, if a child with the same CYPID already exists, but the SUI or PNCID provided in the request body does not match that existing record. Another example might be if more than one identifier (or an identifier and name, address or DOB) was provided in the request body, and those details do not match \u2014 the identifier corresponds to a different child from the biographical details or the multiple identifiers correspond to different children.\n\nAn error response is provided here, but no information will be provided about the children identified by the conflicting request details.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "500": {"description": "Internal server error\n\nAn unexpected error occurred on the server. The request may have been valid, but the server was unable to process it.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}}}}, "/children/{ypid}/": {"get": {"summary": "Fetch the full AssetPlus data packet for the specified child", "tags": ["Find and create children"], "description": "Fetch the full AssetPlus data packet for the specified child, specified in the path `ypid` parameter. The response will be a `CompleteChild` object showing all known data for the child.\n\nNote that future versions of this API might additionally accept other identifiers.\n", "parameters": [{"$ref": "#/components/parameters/ypidParameter"}], "responses": {"200": {"description": "Successful response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CompleteChild"}}}}, "400": {"description": "Bad request\n\nThe request was invalid, for example the `ypid` parameter was invalid, being something other than an integer between 1 and 999999999.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "404": {"description": "Not Found\n\nThe provided `ypid` does not exist or is not associated with any child in the system.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "500": {"description": "Internal server error\n\nAn unexpected error occurred on the server. The request may have been valid, but the server was unable to process it.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}}}}, "/children/{ypid}/stages/": {"parameters": [{"$ref": "#/components/parameters/ypidParameter"}], "get": {"summary": "Fetch all Stages for the specified child", "tags": ["Find, create and update Stages"], "description": "Fetch all Stages for the givin child. The response will be an array of `Stage` objects showing all signed-off Stages for the child specified in the path `ypid` parameter, and any partial Stages that have been saved for that child by the organisation making the request.\n\nNote that this method will return different results depending on the organisation and user making the request, and the current state of the Stages. For example, a user from an organisation with a saved partial Stage and an updated Stage received from another organisation will receive a \u201crebased\u201d Stage, containing the updates from the other organisation, but with their own partial Stage changes applied thereafter. Other organisations requesting Stages for the same child would not see the saved partial Stage, which is only available to the organisation that saved it.\n\nNote that future versions of this API might additionally accept other identifiers.\n", "responses": {"200": {"description": "Successful response", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/Stage"}}}}}, "400": {"description": "Bad request\n\nThe request was invalid, for example the `ypid` parameter was invalid, being something other than an integer between 1 and 999999999.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "404": {"description": "Not Found\n\nThe provided `ypid` does not exist or is not associated with any child in the system.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "500": {"description": "Internal server error\n\nAn unexpected error occurred on the server. The request may have been valid, but the server was unable to process it.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}}}, "post": {"summary": "Create a new AssetPlus Stage for the specified child", "tags": ["Find, create and update Stages"], "description": "This endpoint creates a new AssetPlus record-stub for the child specified in the path `ypid` parameter. The request body must include a `MinimalChild` object, which will be used to confirm that the new Stage is being created for the expected child. The response will include the `stageid` of the newly-created Stage, which can then be used to subsequently update that Stage.\n\nIt is not possible to create a Stage for a child who is not already known to be in the system. If the child's `ypid` is not known, then the client must first search for the child using `GET /children` or `POST /children/search`, and if the child is not found, create the child using `POST /children`. Once the child is created, the client can then create a Stage for that child using this endpoint.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "properties": {"child": {"$ref": "#/components/schemas/MinimalChild"}}}}}}, "responses": {"200": {"description": "Success response\n\nFor a child who is already known to the system, this will return the `stageid` of the newly-created Stage, which can then be used to subsequently update that Stage.\n", "content": {"application/json": {"schema": {"type": "object", "properties": {"stage_id": {"$ref": "#/components/parameters/stageidParameter"}}}}}}, "400": {"description": "Bad request\n\nThe request body was invalid, for example if it did not include a `MinimalChild` object, or if the `MinimalChild` object did not include at least one identifier (OYPID, SUI or PNCID).\n\nAlternatively, some other unexpected error was found in the request data.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "404": {"description": "Not Found\n\nThe provided `ypid` does not exist or is not associated with any child in the system.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "409": {"description": "Conflict\n\nThe request format was valid, but identifiers in the request body conflicted. For example, the child indicated by the `ypid` in the path does not match the identifiers in the request body. Another example might be if more than one identifier (or an identifier and name, address or DOB) was provided in the request body, and those details do not match \u2014 the identifier corresponds to a different child from the biographical details or the multiple identifiers correspond to different children.\n\nAn error response is provided here, but no information will be provided about the children identified by the conflicting request details.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "500": {"description": "Internal server error\n\nAn unexpected error occurred on the server. The request may have been valid, but the server was unable to process it.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}}}}, "/children/{ypid}/stages/{stageid}": {"parameters": [{"$ref": "#/components/parameters/ypidParameter"}, {"$ref": "#/components/parameters/stageidParameter"}], "get": {"summary": "Fetch an AssetPlus Stage (or partial Stage)", "tags": ["Find, create and update Stages"], "description": "This endpoint retrieves an existing AssetPlus Stage, which may be a full Stage or a partial Stage.\n\nPartial Stages will only be provided to a user from the organisation that created the partial Stage. Other organisations requesting a `stageid` that corresponds to a partial Stage will receive a 409 Conflict response, as if the `stageid` does not exist.\n", "responses": {"200": {"description": "Success response, including the requested Stage, including a `MinimalChild` object, which must be used to confirm that the response relates to the expected child.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Stage", "minimumItems": 1, "maximumItems": 1}}}}, "400": {"description": "Bad Request\n\nSome unexpected error occurred with the request data, unrelated to any mismatch between the child and the `stageid`. For example the `ypid` parameter was invalid, being something other than an integer between 1 and 999999999, or the `stageid` parameter was invalid, being something other than a valid GUID.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "409": {"description": "Conflict\n\nThe request format was valid, but the `stageid` parameter does not correspond to the child indicated by the `ypid` parameter. This might be because the `ypid` or the `stageid` are invalid and do not exist. A `409 Conflict` will be returned in both these cases, rather than a `404 Not Found`, to avoid revealing information about which identifiers are valid.\n\nAn error response is provided here, but no information will be provided about the children identified by the conflicting request details.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "500": {"description": "Internal server error\n\nAn unexpected error occurred on the server. The request may have been valid, but the server was unable to process it.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}}}, "patch": {"summary": "Save a partial update to an existing AssetPlus Stage", "tags": ["Find, create and update Stages"], "description": "This endpoint saves a partial update to an existing AssetPlus record. The request body must include at least one property to update. The response will just be an acknowledgement of the update, with no content, or an error response. The response may optionally include a notification message saying that someone else also has a partial Stage open for this child.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "properties": {"stage": {"$ref": "#/components/schemas/Stage"}}}}}}, "responses": {"200": {"description": "Success response, optionally containing a notification message saying that someone else also has a partial Stage open for this child.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Notification", "minimumItems": 0, "maximumItems": 1}}}}, "400": {"description": "Bad request\n\nThe request was invalid, for example the `ypid` parameter was invalid, being something other than an integer between 1 and 999 ded in the request body will be removed from the record, irrespective of whether or not they were sent in a previous PATCH request. The response will just be an acknowledgement of the update, with no content, or an error response. The response may optionally include a notification message saying that someone else also has a partial Stage open for this child.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "properties": {"stage": {"$ref": "#/components/schemas/Stage"}}}}}}, "responses": {"200": {"description": "Success response, optionally containing a notification message saying that someone else also has a partial Stage open for this child.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Notification", "minimumItems": 0, "maximumItems": 1}}}}, "400": {"description": "Bad request\n\nThe request was invalid, for example the `ypid` parameter was invalid, being something other than an integer between 1 and 999999999, or the `stageid` parameter was invalid, being something other than a valid GUID.\n\nAlternatively, some other unexpected error was found in the request data.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "403": {"description": "Forbidden\n\nThe user is attempting to PUT a Stage that has been signed off and is no longer available for editing. Alternatively, the user may be attempting to PUT a Stage that was created by another organisation.\n\nAlternatively, some other unexpected error was found in the request data.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ErrorResponse"}}}}, "409": {"description": "Conflict\n\nThe request format was valid, but the `stageid` parameter does not correspond to the child indicated by the `ypid` parameter. This might be because the `ypid` or the `stageid` are invalid and do not exist. A `409 Conflict` will be returned in both these cases, rather than a `404 Not Fo
