openapi: 3.0.4
info:
  title: Prototype API – transfer and caretaking extensions
  description: |
    Draft **additions** to the prototype AssetPlus API (`../swagger.yaml`). They cover the functions of today's AssetPlus case-transfer process for **YJS ↔ Secure Estate caretaking**, including the YJB Placement Service, on the assumption of a **central store** rather than CMS-to-CMS messaging.

    > **⚠️ This is an illustrative draft of pseudocode for discussion, not a final spec.** It follows the conventions of `../swagger.yaml`.

    This file contains **new routes**, plus a list of **recommended changes to existing routes** in `../swagger.yaml` (below). The existing routes themselves (`/children`, `/children/search`, `/children/{ypid}`, `/children/{ypid}/stages`, and `/children/{ypid}/stages/{stageid}`) remain in `../swagger.yaml`. `MinimalChild` is referenced from that file so there is a single source of truth.

    Each operation cites the current-process requirement it replaces. Short refs (`AP02`, `AP03`, `AP06`, `PROTO`, and XSD file names such as `SimpleTypes`) are listed in `documents-list.md`. XSD citations are to the v12.0.0 files. Operations or properties marked `x-speculative: true` are not based on any source document. Design decisions made by the user in the design session on 2026-11-23 are cited as `(User 2026-11-23 Qn)`. The full record is in `.grill-me/assetplus-api-design-20261123T1315-summary.md`. Decisions on the transfer routes from a follow-up session on 2026-11-24 are cited as `(User 2026-11-24 grill Qn)`; that record is in `.grill-me/transfers-endpoints-necessity-20261124T1200-summary.md`.

    **How the current concepts map to this API (see `api-scope-and-options.md` §3 for alternatives):**

    | Today (AP06 name / v12 schema name) | Here |
    | --- | --- |
    | Data Transfer (sharing) to a secure establishment | Created by the platform when the Placement Service decides, after `POST /children/{ypid}/placement-requests` (User 2026-11-23 Q35–Q37) |
    | Data Transfer (sharing) between YJSs | `POST /children/{ypid}/transfers` (speculative; YJS↔YJS is outside the agreed scope) |
    | Acknowledge Data Transfer (an automatic Connectivity receipt; not a v12 message type) | The `201 Created` response; there is no separate message |
    | Transfer Acceptance / Rejection (v12: Data Transfer Accept / Reject, SimpleTypes L1119–1131) | `PATCH /transfers/{transferid}` with `status: accepted` or `status: rejected` (User 2026-11-24 grill Q7) |
    | Ending caretaking (AP02 L890 SE008, L866 YY011) | `PATCH /transfers/{transferid}` with `status: ended` (User 2026-11-24 grill Q7) |
    | Assessment Update | Completing a stage (an accepted `PUT …/stages/{stageid}`) while a caretaking transfer is `accepted` creates a pending review for the other party |
    | Update Acceptance / Rejection (v12: Assessment Update Accept / Reject) | `POST /children/{ypid}/stages/{stageid}/reviews` |
    | Unstructured_Data (AP06) / stage attachment index (v12, AssessmentTransfer L2679–2690) + secure email | `…/stages/{stageid}/attachments` |
    | Stage cancel (AP02 GE069) | Soft `DELETE …/stages/{stageid}?reason=<code>` (option I2; User 2026-11-23 Q12–Q14) |
    | Stage stop (AP02 GE068) and re-open (AP02 L858 YY026) | **Dropped** (User 2026-11-23 Q10–Q12). See "Departures from the current process" |
    | Duplicate records merged (AP02 L870 YY014) | `POST /children/{ypid}/duplicate-reports` by a CMS; merge by YJB only |

    ## Changes made to `../swagger.yaml`

    The decisions from the design session on 2026-11-23 that change routes in `../swagger.yaml` were applied on 2026-11-24, in commit `6feec52`, through three patches in this folder: `swagger-recommended-changes.patch`, `swagger-shared-responses.patch` and `swagger-shared-schemas.patch`. The user chose each change (User 2026-11-24). `../swagger.yaml` is now the reference for:

    - **Implicit status changes; no transitions API** (User 2026-11-23 Q8). `POST …/stages` creates a partial stage and takes `stage_type`, `case_type`, `schema_version` and an optional `supersedes`, with `422` for broken rules (Q24, Q28, Q29, Q31). An accepted `PUT` completes the stage and returns its new status in `StageStatusResponse`; the old optional `Notification` was dropped from `PUT` (Q7; User 2026-11-24). `DELETE` is a soft cancel of a partial stage, with `?reason=<code>` and an `X-Signoff-User` header (option I2; Q12–Q14).
    - **Concurrency** (Q2–Q4, Q16, Q18, Q20–Q22): `ETag`, a required `If-Match`, `412` with `StageOutcome`, `428`, and `Idempotency-Key` on `POST`, `PATCH` and `PUT` (not on `DELETE`, where a repeated cancel is harmless; User 2026-11-24). ⚠️ The rebase of a stale `PATCH` with no conflict is still inferred, not confirmed.
    - **`Stage` fields** (Q15, Q24, Q31, Q43): `stageid`, `status` (`StageStatus`), `stage_type`, `case_type`, `schema_version`, `supersedes` / `superseded_by`, the two countersignatures, `attachment_ids`, `organisation`, `owner`, `created_at` and `completed_at`. `proxy_owner` was left out (User 2026-11-24).
    - **Since 2026-11-26**, through a fourth patch, `swagger-operation-ids.patch` (User 2026-11-26): every operation has an `operationId`; `/children/{ypid}` and `/children/{ypid}/stages` have no trailing slash; a `PATCH` of a stage returns `204 No Content`, or `200` with a `Notification` when someone else also has a partial stage open for the child; and `MinimalChild.DateOfBirth` is nullable.

    This file refers to `StageStatus` and `Stage` in `../swagger.yaml` rather than defining its own copies.

    **Still recommended, not yet made** (left out of the patches by the user on 2026-11-24):

    - **Schema versions (Q30–Q32).** Stored stages are never migrated. `GET` returns each stage under the `schema_version` it was written in, and CMSs must be able to read older versions. After the annual schema change, a partial stage may still be completed under its original version for a grace period that YJB sets; after that, `422`.
    - **Merged children (Q26).** A request to a `ypid` that has been merged away returns `308 Permanent Redirect` to the surviving `ypid`. A redirected `PATCH` or `PUT` carries the old record's `ETag`, so it will get `412`; the CMS must fetch the stage again.
    - **`GET …/stages` filters** (`type`, `status`, `completed_from`, `completed_to`) and cancelled stages as summary entries; and **`403` wording for caretakers** (`api-scope-and-options.md` §4).

    ## Departures from the current process

    Each of these was decided on 2026-11-23 or 2026-11-26, but YJB or the business should check them:
    - **No stop.** Today a stage can be stopped, with a reason and a snapshot (AP02 L526 GE068). A partial stage that's never finished now does the same job, and stale partial stages are reported on rather than expired (Q12, Q23).
    - **No reopen.** Today a stage can be reopened from the caretaking statuses (AP02 L858 YY026). `completed_shared` is now final, and a `completed_rejected` stage stays as a read-only record and is replaced by a new stage that `supersedes` it (Q10, Q11, Q24).
    - **Anyone in the owning organisation can cancel**, not just the owner (AP02 L527 GE069), with two-person sign-off in the CMS (Q13).
    - **Only partial stages can be cancelled.** Today the caretaking statuses can be cancelled too (AP02 L858 YY026). ⚠️ Inferred from Q10–Q12.
    - **'Completed – awaiting Transfer' becomes "partial".** A stage that's signed off locally but not yet accepted by the platform is still partial (Q7).
    - **A rejected stage isn't deleted at the rejecting end.** Today the rejecting YJS deletes it (AP02 L863 YY009). Now it stays in the record, marked `completed_rejected`, and the reviewer's next stage takes it in (User 2026-11-26).
    - **Completing a stage waits for the other party's stages.** An organisation can't complete its open stage until it has reviewed, and rebased onto, every stage the other party has completed. Today each CMS has its own one-stage-in-progress rule and nothing coordinates them (AP02 L881 SE015). Decided 2026-11-26 (User 2026-11-26; DSYNC p1).

    **Caller identity.** The caller's organisation (OU code) and role are assumed to come from the authentication token. Where a source says the YJS decides which roles may accept or reject (AP02 L891 SE009, L872 YY016), a caller without that role gets `403 Forbidden`.
  version: 0.0.4-draft

servers: []

tags:
  - name: Organisations
    description: YJSs, secure establishments and the Placement Service, addressed by OU code
  - name: Transfers and caretaking
    description: Requesting, accepting, rejecting and ending caretaking (and complete) transfers
  - name: Stage lifecycle and review
    description: Reviewing stages shared by the other party, and reading a stage's history and changes. Status changes happen through the stage routes in `../swagger.yaml`
  - name: Attachments
    description: Files attached to a stage (replaces the Unstructured_Data list plus secure email)
  - name: Placements
    description: YJB Placement Service requests that lead to secure-estate caretaking
  - name: Records
    description: Reporting and merging duplicate AssetPlus records
  - name: Reference data
    description: Lists of controlled values

paths:
  /organisations:
    get:
      summary: List organisations that can send or receive transfers
      tags: [Organisations]
      description: |
        Returns YJSs, secure establishments and the Placement Service, so a client can choose a transfer destination by OU code.

        Today the destination is chosen by the person starting the transfer (AP06 L272) and identified by OU code in the message header (AP06 L416–419; AssessmentTransfer L360–365, SimpleTypes L1889–1894).

        **Who maintains the list.** YJB adds, renames and retires organisations through the platform's internal admin UI. This public API can only read the list (User 2026-11-23 Q46). A retired organisation stays readable, with `status: retired` and the OU code it was merged into, so that old stages and transfers still resolve (Q46).

        **When two YJSs merge,** YJB retires one into the other, and the platform automatically moves ownership of everything the old YJS owned (partial stages, pending reviews, active transfers) to the new one. The new YJS's staff then see the old YJS's partial stages and inbox. If both YJSs had a partial stage for the same child, both carry on; the one-partial-stage-per-organisation rule applies only to new `POST`s (User 2026-11-23 Q47, Q48).

        **Source gap.** AP03 lists 258 YJSs with OU code, name and Connectivity name (AP03 'YOT Full List'), but only as of 2014. No source lists secure establishments or the Placement Service: the schema knows only the establishment type (SCH, STC or YOI; SimpleTypes L823–829) and a free-text establishment name (AssessmentTransfer L230). See `api-scope-and-options.md` Q14.
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/OrganisationType"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrganisationStatus"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organisation"
        '500':
          $ref: "#/components/responses/ServerError"

  /organisations/{ou_code}:
    parameters:
      - name: ou_code
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Fetch one organisation by OU code
      tags: [Organisations]
      description: |
        Returns the organisation, including retired ones (User 2026-11-23 Q46).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        '404':
          description: No organisation has this OU code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          $ref: "#/components/responses/ServerError"

  /children/{ypid}/transfers:
    parameters:
      - $ref: "#/components/parameters/ypidParameter"
    get:
      summary: List transfers (current and past) for a child
      tags: [Transfers and caretaking]
      description: |
        Lists every transfer for the child that is visible to the caller's organisation. A transfer with status `requested` or `accepted` is what the "transferred / caretaking" flag shows today, which must distinguish requested from accepted (AP02 L875 SE026, L845 YY032).
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TransferStatus"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transfer"
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          $ref: "#/components/responses/ChildNotFound"
        '500':
          $ref: "#/components/responses/ServerError"
    post:
      summary: Request a YJS↔YJS caretaking or complete transfer (speculative)
      tags: [Transfers and caretaking]
      x-speculative: true
      description: |
        **Speculative; outside the agreed scope.** No CMS calls this for the in-scope YJS→SE flow: the platform creates those transfers when the Placement Service decides (User 2026-11-23 Q35–Q37). It's kept as a sketch of how YJS↔YJS caretaking and complete transfers would use the same transfer resource (User 2026-11-24 grill Q4).

        Replaces the AP06 **Data Transfer** message (AP06 §6.3.1, L404–432; sharing §6.4, L476–478).

        In a central store no data is copied. The recipient organisation is given access to the child's completed stages once it accepts. Before accepting, it can view the assessment, as today (AP02 L850 YY005).

        The server enforces the current preconditions and returns `422` with the rule ID if one fails:
        - `SE002` / `YY003`: the last stage is completed and no stage is in progress (AP02 L876, L846)
        - `SE020` / `YY023`: no existing caretaking arrangement (AP02 L877, L847)
        - `YY013`: a Host YJS cannot transfer on to another YJS (AP02 L868)
        - `YY017`: no complete transfer for a Looked After Child (AP02 L849)
        - `YY004` (Should): no complete transfer with breach proceedings pending (AP02 L848)

        Transfers to a secure establishment must be `caretaking` and always go via the YJB Placement Service (AP02 L874 SE001). So this route returns `422` with rule `SE001` if `to_ou_code` is a secure establishment (User 2026-11-24 grill Q11). A YJS's CMS starts that process with `POST /children/{ypid}/placement-requests`.

        The `child` property confirms the request is for the expected child, following the `POST /children/{ypid}/stages` convention in `../swagger.yaml`. It mitigates the "Wrong AssetPlus" rejection reason (AP06 L339).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
      responses:
        '201':
          description: |
            Transfer requested (status `requested`). This replaces the automatic Connectivity "acknowledge" (AP06 §6.3.2, L400).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        '400':
          $ref: "#/components/responses/BadRequest"
        '403':
          $ref: "#/components/responses/Forbidden"
        '409':
          $ref: "#/components/responses/ChildConflict"
        '422':
          $ref: "#/components/responses/RuleViolation"
        '500':
          $ref: "#/components/responses/ServerError"

  /transfers:
    get:
      summary: Transfer inbox and outbox for the caller's organisation
      tags: [Transfers and caretaking]
      description: |
        Lets a receiving organisation, including a secure establishment, find transfers waiting for its decision (User 2026-11-24 grill Q1). Option C3 makes this polled inbox the source of truth (User 2026-11-23 Q38). Today acceptance is user-driven (AP06 L400), and users are reminded until they decide (AP02 L886 SE005). This is the polling half of `api-scope-and-options.md` option C; `/subscriptions` is the push half.
      parameters:
        - name: direction
          in: query
          schema:
            type: string
            enum: [incoming, outgoing]
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TransferStatus"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/TransferType"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transfer"
        '400':
          $ref: "#/components/responses/BadRequest"
        '500':
          $ref: "#/components/responses/ServerError"

  /transfers/{transferid}:
    parameters:
      - $ref: "#/components/parameters/transferidParameter"
    get:
      summary: Fetch a transfer
      tags: [Transfers and caretaking]
      description: |
        The target of the `Location` header when a transfer is created, and of webhook hints (option C3; User 2026-11-23 Q38).
      responses:
        '200':
          description: Success. The `ETag` header is the version to send as `If-Match` in a `PATCH`.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        '404':
          $ref: "#/components/responses/TransferNotFound"
        '500':
          $ref: "#/components/responses/ServerError"
    patch:
      summary: Accept, reject or end a transfer
      tags: [Transfers and caretaking]
      description: |
        Changes the transfer's `status`. There's no separate call per action, consistent with the rule for stages that status changes happen through ordinary calls (User 2026-11-23 Q8; User 2026-11-24 grill Q7). This replaces the earlier draft's `POST …/acceptance`, `…/rejection` and `…/ending` routes.

        **Accept** (`status: accepted`). Replaces **Transfer Acceptance** (AP06 §6.3.3, L456–474). Only the recipient organisation can accept, and only a `requested` transfer. Which roles may accept or reject is configurable (AP02 L891 SE009, L872 YY016); other callers get `403`. The sender is notified automatically (AP02 L852 YY019). Once accepted, either party can complete and share stages (AP02 L878 SE019, L882 SE004). For a `complete` transfer, case ownership moves to the recipient.

        A secure establishment must accept or reject the transfer the platform creates from the Placement Service's decision; the decision alone doesn't make it accepted (User 2026-11-24 grill Q1). Today acceptance is a user's decision (AP06 L400).

        **Reject** (`status: rejected`, with `rejection`). Replaces **Transfer Rejection** (AP06 §6.3.3; v12 message type "Data Transfer Reject", SimpleTypes L1119–1131). Same caller and starting-status rules as accepting.
        - A YJS uses a code from `GET /reference-data/transfer-rejection-reasons`, the initial-transfer list (AP06 L336–347; AP02 L850 YY005). The v12 schema has one list of all eight reasons and doesn't limit the first three to initial transfers, as AP06 does (SimpleTypes L1342–1353; AP06 L347). This API keeps AP06's split.
        - A secure establishment uses a code from `GET /reference-data/se-transfer-rejection-reasons`, a separate list whose values YJB will define (User 2026-11-24 grill Q8). Today's list has no reasons about the placement itself.
        - When a secure establishment rejects, the placement request goes back to the Placement Service with status `rejected_by_establishment`, so Placements can choose another establishment. The requesting YJS sees this on its placement request (User 2026-11-24 grill Q2).
        - Today "the framework must be deleted in the rejecting YOT" (AP02 L850 YY005). Here, the recipient simply loses access.

        **End** (`status: ended`, with `ending_outcome`). Only an `accepted` caretaking transfer can be ended. After this, stages are no longer shared and the caretaker loses write access (AP02 L890 SE008, L866 YY011).
        - For YJS↔YJS caretaking, only the Home YJS can end it. `complete_transfer_to_host` turns it into a complete transfer to the Host YJS (AP02 L866 YY011).
        - **⚠️ Speculative: ending secure-estate caretaking.** Until YJB decides how it should end (User 2026-11-24 grill Q5; `api-scope-and-options.md` Q24), the Home YJS can end it with `ending_outcome: returned_to_home` (User 2026-11-24 grill Q10). That meets SE008's minimum: the system must allow the Home YJS to end it, because the young person has left custody and returned to the YJS (AP02 L890). SE008 doesn't rule out ending automatically on release, or the SE ending it, so this may change.

        **Concurrency** (User 2026-11-24 grill Q9). `If-Match` is required, with the `ETag` from `GET`; without it the platform returns `428`. A stale `If-Match` gets `412` and nothing is applied. Unlike stages, there's no rebase and no `outcome` field: a transfer has only one real field, `status`. The caller fetches the transfer again and decides whether its change still applies. `412` means the caller's view was out of date; `422` means the change isn't allowed from the current status. `Idempotency-Key` works as on the stage routes (User 2026-11-23 Q22), so a retry after a lost response replays the original result rather than getting `412`.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: Reused on every retry of the same change (User 2026-11-23 Q22; User 2026-11-24 grill Q9).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferUpdate"
      responses:
        '200':
          description: Updated. Returns the transfer and its new `ETag`.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        '400':
          $ref: "#/components/responses/BadRequest"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/TransferNotFound"
        '412':
          description: |
            Precondition Failed. The transfer has changed since the caller read it. Nothing was applied; fetch it again (User 2026-11-24 grill Q9).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '428':
          description: |
            Precondition Required. The request had no `If-Match` header (RFC 6585 §3; User 2026-11-24 grill Q9).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '422':
          $ref: "#/components/responses/RuleViolation"
        '500':
          $ref: "#/components/responses/ServerError"

  /children/{ypid}/stages/{stageid}/history:
    parameters:
      - $ref: "#/components/parameters/ypidParameter"
      - $ref: "#/components/parameters/stageidParameter"
    get:
      summary: The stage's audit history
      tags: [Stage lifecycle and review]
      description: |
        Lists the stage's events in time order: created, saved, rebased, completed, shared, reviewed, superseded and cancelled. Each event records who did it and when (User 2026-11-23 Q39). This exposes the audit trail that every change must have (AP02 L536 GE015), including cancelled stages (AP02 L527 GE069).

        The same privacy rule applies as for partial stages: events on a partial stage are visible only to the organisation that owns it (swagger.yaml L369).

        **Replaces the transitions route.** An earlier draft had `POST …/stages/{stageid}/transitions` for complete, stop, cancel and reopen. It was removed because status changes now happen implicitly through `POST`, `PATCH`, `PUT` and `DELETE` on the stage (User 2026-11-23 Q8). See `PUT` and `DELETE` on `/children/{ypid}/stages/{stageid}` in `../swagger.yaml`.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StageHistoryEvent"
        '409':
          $ref: "#/components/responses/ChildConflict"
        '500':
          $ref: "#/components/responses/ServerError"

  /children/{ypid}/stages/{stageid}/reviews:
    parameters:
      - $ref: "#/components/parameters/ypidParameter"
      - $ref: "#/components/parameters/stageidParameter"
    get:
      summary: List reviews of a shared stage
      tags: [Stage lifecycle and review]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
        '409':
          $ref: "#/components/responses/ChildConflict"
        '500':
          $ref: "#/components/responses/ServerError"
    post:
      summary: Accept or reject a stage shared by the other party
      tags: [Stage lifecycle and review]
      description: |
        Replaces **Update Acceptance or Rejection** (AP06 §6.5.3, L554–556):
        - **Accept:** the stage becomes `completed` and the sender is notified (AP02 L887 SE014, L864 YY022).
        - **Reject:** the stage becomes `completed_rejected` (AP02 L886 SE005). The reason must come from the update list: Level of completeness, Errors of fact, Conflict in stages, Caretaking has ended, Other (AP02 L886 SE005, AP06 L341–345; SimpleTypes L1342–1353).

        Before deciding, the reviewer can view the stage and its changes (`…/changes`) (AP02 L863 YY009, L888 SE006).

        This is option B1 in `api-scope-and-options.md` §B, which follows from the 2026-11-23 decisions (User 2026-11-23 Q10, Q11):
        - **While under review**, a `completed_shared` stage is visible to every reader, along with its review status, for example `review: pending` (Q33). The organisation that completed it can't reopen it (Q10).
        - **A rejected stage** stays as a read-only record. To correct it, the originating organisation creates a new stage with `POST /children/{ypid}/stages`, giving `supersedes` as the URI of the rejected stage. The platform checks that the superseded stage is `completed_rejected` and belongs to the same child, and adds a `superseded_by` link to it. No content is copied across (Q11, Q24). ⚠️ Inferred, not confirmed: rejected stages stay visible to every reader, with their status and `superseded_by` link.
        - **Three-way arrangements** (Home YJS, Host YJS and a Secure Estate): the Home YJS reviews every stage completed by the Host YJS or the Secure Estate, and the Home YJS's own stages are reviewed by the active caretaker (Q34), consistent with SE001 (AP02 L874). **Gap:** if a Host YJS and a Secure Estate are both active caretakers, it's not yet decided which of them reviews the Home YJS's stages.

        **Extended 2026-11-26** (User 2026-11-26; DSYNC p1; `api-scope-and-options.md` option B):
        - **A decision is final.** A reviewer won't turn a rejection into an acceptance; the originator may issue a new stage that `supersedes` the rejected one. ⚠️ Inferred, not confirmed: a second decision on the same stage gets `422`.
        - **The reviewer can't complete its own open stage until it has decided**, and has rebased that stage onto the reviewed stage, rejected or not. It then sets `based_on` on its stage. `PUT …/stages/{stageid}` returns `422` until then. This applies in both directions. See `swagger-review-rebase.patch`.
        - **A rejected stage stays in the reviewer's record**, unlike today's deletion at the rejecting end (AP02 L863 YY009). The reviewer's own stage can record where it disagrees.
        - ⚠️ Not confirmed: whether the decision needs the same two-person sign-off as completing a stage (`api-scope-and-options.md` Q26, for YJB).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecision"
      responses:
        '201':
          description: Review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        '400':
          $ref: "#/components/responses/BadRequest"
        '403':
          $ref: "#/components/responses/Forbidden"
        '409':
          $ref: "#/components/responses/ChildConflict"
        '422':
          $ref: "#/components/responses/RuleViolation"
        '500':
          $ref: "#/components/responses/ServerError"

  /reviews:
    get:
      summary: Shared stages awaiting the caller organisation's review
      tags: [Stage lifecycle and review]
      description: |
        The review inbox. Users are reminded until they accept or reject (AP02 L886 SE005, L863 YY009).
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, accepted, rejected]
            default: pending
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingReview"
        '500':
          $ref: "#/components/responses/ServerError"

  /children/{ypid}/stages/{stageid}/changes:
    parameters:
      - $ref: "#/components/parameters/ypidParameter"
      - $ref: "#/components/parameters/stageidParameter"
    get:
      summary: Changes in this stage compared with the previous completed stage
      tags: [Stage lifecycle and review]
      description: |
        Lets the receiving party "identify the changes made" and "extract to PDF and print" (AP02 L888 SE006, L865 YY010). It also matches the AP06 audit approach of comparing a stage with the previous stage (AP06 L256).

        Request `Accept: application/pdf` for a printable version.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageChanges"
            application/pdf:
              schema:
                type: string
                format: binary
        '409':
          $ref: "#/components/responses/ChildConflict"
        '500':
          $ref: "#/components/responses/ServerError"

  /children/{ypid}/stages/{stageid}/attachments:
    parameters:
      - $ref: "#/components/parameters/ypidParameter"
      - $ref: "#/components/parameters/stageidParameter"
    get:
      summary: List attachments on a stage
      tags: [Attachments]
      description: |
        Replaces the `Unstructured_Data` list, which catalogued files sent "via alternate means e.g. secure email" because Connectivity could not carry them (AP06 L260–266). In the v12 schema that list became an attachment index for each stage, giving each file's section and document name (AssessmentTransfer L2679–2690). `Unstructured_Data` was removed in v3.0.1 (AssessmentTransfer L66). Attachments are uploaded at section level (AP02 L537 GE019).

        **Attachments follow the stage's lifecycle (User 2026-11-23 Q43).** They're sub-resources of the stage. They can be added or removed only while the stage is partial; `POST` or `DELETE` on a completed stage gets `422`. The completing `PUT` lists the attachment IDs being signed off, so the countersignatories sign off the files too. A document that arrives after completion goes on a new stage. ⚠️ Inferred, not confirmed: attachments on a partial stage are visible only to the organisation that owns it, like the stage (swagger.yaml L369).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attachment"
        '409':
          $ref: "#/components/responses/ChildConflict"
        '500':
          $ref: "#/components/responses/ServerError"
    post:
      summary: Upload an attachment to a stage
      tags: [Attachments]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                section:
                  type: string
                  description: |
                    The section of the assessment the file belongs to, for example "Explanations & Conclusions" (AP02 L537 GE019). This is free text, as it is in the v12 schema (AssessmentTransfer L2689). The platform stores whatever the CMS sends and doesn't check it against a list (User 2026-11-23).

                    **Known weakness.** Free text means different CMSs can label the same section differently, for example "Explanations & Conclusions", "Explanations and Conclusions" or "E&C". A reader then sees three different sections, and can't reliably group or filter files by section. This was accepted to keep things unchanged for current CMSs and for the AP06 adapter.

                    **Possible future change.** The platform could publish a fixed list of section names (for example `GET /reference-data/sections`) and reject anything else with `422`. Every CMS would then use the same labels. The list would need updating when the annual schema change alters the sections, and the AP06 adapter would need to map old free-text labels onto it (User 2026-11-23).
              required: [file]
      description: |
        Every upload is scanned for malware before anyone else can download it (`api-scope-and-options.md` item 12). Scanning can take seconds to minutes, so the upload is asynchronous (User 2026-11-23 Q44). The platform returns `202 Accepted`, with the attachment's URI in `Location` and `scan_status: pending`. The CMS polls `GET …/attachments/{attachmentid}` until `scan_status` is `clean` or `rejected`. A completing `PUT` that lists an attachment that isn't `clean` gets `422`.

        Uploads support the `Idempotency-Key` header, as the stage routes do (Q22).
      responses:
        '202':
          description: Accepted for scanning. `Location` gives the attachment's URI.
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        '400':
          $ref: "#/components/responses/BadRequest"
        '403':
          $ref: "#/components/responses/Forbidden"
        '409':
          $ref: "#/components/responses/ChildConflict"
        '422':
          $ref: "#/components/responses/RuleViolation"
        '500':
          $ref: "#/components/responses/ServerError"

  /children/{ypid}/stages/{stageid}/attachments/{attachmentid}:
    parameters:
      - $ref: "#/components/parameters/ypidParameter"
      - $ref: "#/components/parameters/stageidParameter"
      - name: attachmentid
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Fetch an attachment's details, or download it
      tags: [Attachments]
      description: |
        With `Accept: application/json`, returns the attachment's details, including `scan_status` (User 2026-11-23 Q44). With `Accept: application/octet-stream`, returns the file, but only once `scan_status` is `clean`; until then the download gets `409`. ⚠️ The status code for "not yet scanned" wasn't discussed; `409` is a placeholder, and it overlaps the identifier-mismatch meaning.
      responses:
        '200':
          description: The attachment's details, or the file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
            application/octet-stream:
              schema:
                type: string
                format: binary
        '409':
          $ref: "#/components/responses/ChildConflict"
        '500':
          $ref: "#/components/responses/ServerError"
    delete:
      summary: Remove an attachment from a partial stage
      tags: [Attachments]
      description: |
        Allowed only while the stage is partial; `422` otherwise (User 2026-11-23 Q43). The removal is recorded in the stage's history (Q39).
      responses:
        '204':
          description: Removed
        '403':
          $ref: "#/components/responses/Forbidden"
        '409':
          $ref: "#/components/responses/ChildConflict"
        '422':
          $ref: "#/components/responses/RuleViolation"
        '500':
          $ref: "#/components/responses/ServerError"

  /children/{ypid}/placement-requests:
    parameters:
      - $ref: "#/components/parameters/ypidParameter"
    post:
      summary: Ask the Placement Service to place a child in the secure estate
      tags: [Placements]
      description: |
        AP02 says a YJS→SE transfer "will always be via the YJB Placement Service" (AP02 L874 SE001), and the Custody module gives placements "appropriate information to make a placement" (AP02 L484). Neither document describes the Placement Service process.

        **Decided 2026-11-23.** The Placement Service uses its own web UI, on an internal platform API, rather than a third-party system calling this API (User 2026-11-23 Q35, Q36). So the public API keeps only this minimal route, for the YJS's CMS to start a placement, and a `GET` to follow its status (Q37). The Placement Service's decision, and its choice of secure establishment, happen internally. When the decision is made, the platform creates a `caretaking` transfer from the YJS to the chosen establishment, with status `requested` (AP02 L874 SE001).

        The referenced stage would normally be a completed Placement Notification, Bail Recommendation, PSR (All options) or Post Court stage, which carry the Custody module (AP06 L365–369, AP02 L517 GE044).

        The YJS's recommendation is already in that stage's data: the initial placement recommendation as an establishment type (SCH, STC or YOI), whether there's an establishment the child should not go to, and anything else Placements should know (AssessmentTransfer L1148–1186; SimpleTypes L823–829; PROTO 'Custody' rows 218–238). So this request doesn't repeat it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlacementRequestCreate"
      responses:
        '201':
          description: Created. `Location` gives the placement request's URI.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementRequest"
        '400':
          $ref: "#/components/responses/BadRequest"
        '403':
          $ref: "#/components/responses/Forbidden"
        '409':
          $ref: "#/components/responses/ChildConflict"
        '422':
          $ref: "#/components/responses/RuleViolation"
        '500':
          $ref: "#/components/responses/ServerError"

  /children/{ypid}/placement-requests/{placementrequestid}:
    parameters:
      - $ref: "#/components/parameters/ypidParameter"
      - $ref: "#/components/parameters/placementrequestidParameter"
    get:
      summary: Follow a placement request's status
      tags: [Placements]
      description: |
        Lets the requesting YJS's CMS see whether the child has been placed, where, and the resulting transfer (User 2026-11-23 Q37). The Placement Service's own work queue is internal and isn't part of this API (Q36).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementRequest"
        '409':
          $ref: "#/components/responses/ChildConflict"
        '500':
          $ref: "#/components/responses/ServerError"

  /children/{ypid}/merges:
    parameters:
      - $ref: "#/components/parameters/ypidParameter"
    post:
      summary: Merge a duplicate AssetPlus record into this child
      tags: [Records]
      description: |
        Today two copies of the framework can be merged by combining all stages in completion-date order and renumbering episodes by creation date (AP02 L870 YY014). In a central store the copies are two `ypid`s for the same child. `../todo.md` L17 notes that a child can currently have more than one AssetPlus record.

        **Decided 2026-11-23:**
        - **One record per child.** A second record is an accidental duplicate to be merged, so stages stay flat under `/children/{ypid}/stages` and aren't pushed down a level (User 2026-11-23 Q25). That answers `../todo.md` L17.
        - **Only YJB or a central team may merge.** CMS callers get `403` (Q27). CMSs report suspected duplicates with `POST /children/{ypid}/duplicate-reports` instead (Q42). In practice this route is used by YJB's internal admin UI.
        - **The duplicate `ypid` is retired.** Afterwards, any request to it returns `308 Permanent Redirect` to the surviving `ypid` (Q26). A practitioner who asks for either `ypid` is entitled to learn that they're the same child, so the redirect isn't a disclosure concern (User 2026-11-23, Q26 discussion).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                duplicate_ypid:
                  type: integer
                  minimum: 1
                  maximum: 999999999
                reason:
                  type: string
              required: [duplicate_ypid]
      responses:
        '200':
          description: Merged
          content:
            application/json:
              schema:
                type: object
                properties:
                  ypid:
                    type: integer
                  retired_ypid:
                    type: integer
        '400':
          $ref: "#/components/responses/BadRequest"
        '403':
          $ref: "#/components/responses/Forbidden"
        '409':
          $ref: "#/components/responses/ChildConflict"
        '422':
          $ref: "#/components/responses/RuleViolation"
        '500':
          $ref: "#/components/responses/ServerError"

  /children/{ypid}/duplicate-reports:
    parameters:
      - $ref: "#/components/parameters/ypidParameter"
    post:
      summary: Report a suspected duplicate record for this child
      tags: [Records]
      description: |
        A CMS that thinks two `ypid`s are the same child reports it here. YJB works through the reports in its internal UI and, if they agree, merges the records with `POST /children/{ypid}/merges`. The CMS can follow the report's status, and once the merge is done, the retired `ypid` returns `308` (User 2026-11-23 Q26, Q27, Q42).

        No source defines how duplicates are matched (AP02 L870 YY014).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuplicateReportCreate"
      responses:
        '201':
          description: Report created. `Location` gives its URI.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateReport"
        '400':
          $ref: "#/components/responses/BadRequest"
        '409':
          $ref: "#/components/responses/ChildConflict"
        '500':
          $ref: "#/components/responses/ServerError"

  /children/{ypid}/duplicate-reports/{reportid}:
    parameters:
      - $ref: "#/components/parameters/ypidParameter"
      - name: reportid
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Follow a duplicate report's status
      tags: [Records]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateReport"
        '409':
          $ref: "#/components/responses/ChildConflict"
        '500':
          $ref: "#/components/responses/ServerError"

  /reference-data/{list}:
    parameters:
      - name: list
        in: path
        required: true
        schema:
          type: string
          enum:
            - transfer-rejection-reasons
            - se-transfer-rejection-reasons
            - update-rejection-reasons
            - cancellation-reasons
            - duplicate-report-reasons
            - stage-types
            - stage-statuses
            - case-types
            - establishment-types
            - organisation-types
    get:
      summary: Controlled value lists
      tags: [Reference data]
      description: |
        Today these are enumerations fixed in the XSD (static lookups, AP06 L241) or in the requirements. Sources for each list:
        - rejection reasons: AP06 L336–347; SimpleTypes L1342–1353
        - SE transfer rejection reasons: for a secure establishment rejecting a transfer created from a placement decision (User 2026-11-24 grill Q8). **Gap:** no source defines them; YJB is to set the values. Today's list (AP06 L336–347) has no reasons about the placement itself.
        - cancellation reasons: the codes for `DELETE …/stages/{stageid}?reason=` (User 2026-11-23 Q13). **Gap:** today the cancel reason seems to be free text (AP02 L527 GE069), and no source gives a list of codes, so the list needs defining.
        - duplicate-report reasons: for `POST /children/{ypid}/duplicate-reports` (User 2026-11-23 Q42). ⚠️ Speculation: no source defines them.
        - stage types: AP02 L520 GE034; SimpleTypes L166–184. Each item's `applies_to` says which organisation types and case types may create it; the platform enforces these (User 2026-11-23 Q29)
        - stage statuses: AP02 L524 GE058; SimpleTypes L1731–1738
        - case types: SimpleTypes L291–301
        - establishment types: SimpleTypes L823–829

        AP03 has a master list of YJB reference data, but it dates from 2014 (AP03 'YJBDropDownLists'). The v12 XSD values should take priority. Dynamic lists such as offence codes are validated by each CMS (AP06 L243).

        Serving them from the API lets clients stay in step with the server.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReferenceItem"
        '500':
          $ref: "#/components/responses/ServerError"

  /subscriptions:
    post:
      summary: Subscribe to transfer and review events (webhooks)
      tags: [Transfers and caretaking]
      description: |
        **Option C3 in `api-scope-and-options.md`, decided 2026-11-23** (User 2026-11-23 Q38). The polled inboxes (`GET /transfers`, `GET /reviews`) are the source of truth. Webhooks are optional hints that tell a CMS to poll now. A CMS that doesn't subscribe loses nothing but timeliness. Replaces the automatic notifications sent today:
        - acceptance of a transfer (AP02 L852 YY019)
        - acceptance of an update (AP02 L887 SE014)
        - rejection (AP02 L886 SE005)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                callback_url:
                  type: string
                  format: uri
                events:
                  type: array
                  items:
                    type: string
                    enum:
                      - transfer.requested
                      - transfer.accepted
                      - transfer.rejected
                      - transfer.ended
                      - stage.shared
                      - review.accepted
                      - review.rejected
                      - placement_request.decided
                      - duplicate_report.resolved
              required: [callback_url, events]
      responses:
        '201':
          description: Subscribed
        '400':
          $ref: "#/components/responses/BadRequest"
        '500':
          $ref: "#/components/responses/ServerError"

components:
  parameters:
    ypidParameter:
      name: ypid
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 999999999
      description: The internal AssetPlus identifier for a child (as `../swagger.yaml`).
    stageidParameter:
      name: stageid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The internal identifier for an AssetPlus Stage (as `../swagger.yaml`).
    transferidParameter:
      name: transferid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    placementrequestidParameter:
      name: placementrequestid
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Bad request. The request was malformed or failed schema validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: |
        Forbidden. The caller's organisation is not a party to this resource, or the caller's role is not allowed to perform the action (AP02 L891 SE009, L872 YY016).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ChildNotFound:
      description: The provided `ypid` does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ChildConflict:
      description: |
        Conflict. As in `../swagger.yaml`, a `stageid` that doesn't belong to the `ypid`, or a `child` body that doesn't match the `ypid`, returns 409 rather than 404 to avoid revealing which identifiers exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TransferNotFound:
      description: The transfer does not exist or the caller's organisation is not a party to it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RuleViolation:
      description: |
        Unprocessable. The request is well-formed but breaks a business rule. `rule` gives the requirement ID from the source documents (e.g. `SE002`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RuleViolation"
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: A human-readable error message.
    RuleViolation:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            rule:
              type: string
              description: Requirement ID that was broken, e.g. `SE002`, `SE020`, `YY017`, `GE059`.
              example: SE002

    OrganisationType:
      type: string
      enum: [yjs, secure_establishment, placement_service, probation]
    Organisation:
      type: object
      properties:
        ou_code:
          type: string
          description: Organisational Unit code, as used in the AP06 header (`Originating_YOT/OUCode`, AP06 L416) and the v12 header (`Originating_Organisation/OUCode`, AssessmentTransfer L360; SimpleTypes L1889–1894), e.g. `F00BA00` (AP06 L496; AP03 'YOT Full List'). The v12 Assessment ID uses a "YJS 2-letter code" instead (AssessmentTransfer L348); see `api-scope-and-options.md` Q16.
        name:
          type: string
        type:
          $ref: "#/components/schemas/OrganisationType"
        status:
          $ref: "#/components/schemas/OrganisationStatus"
        merged_into_ou_code:
          type: string
          nullable: true
          description: For a retired YJS, the OU code of the YJS it was merged into (User 2026-11-23 Q46, Q47).
      required: [ou_code, name, type, status]
    OrganisationStatus:
      type: string
      enum: [active, retired]
      description: Retired organisations stay readable so that old stages and transfers still resolve (User 2026-11-23 Q46).

    TransferType:
      type: string
      enum: [caretaking, complete]
      description: |
        `caretaking` = temporary home/host sharing. `complete` = ownership moves (AP02 L844 YY002). Transfers to a secure establishment are always `caretaking` (AP02 L874 SE001).
    TransferStatus:
      type: string
      enum: [requested, accepted, rejected, ended]
      description: |
        `requested` / `accepted` drive the "transferred / caretaking" flag (AP02 L875 SE026). `rejected` / `ended` clear it.
    TransferRequest:
      type: object
      properties:
        child:
          $ref: "../swagger.yaml#/components/schemas/MinimalChild"
        type:
          $ref: "#/components/schemas/TransferType"
        to_ou_code:
          type: string
          description: Recipient organisation. Chosen by the person starting the transfer (AP06 L272).
        note:
          type: string
          description: Free text, for example a reference to the off-system agreement (AP06 L399).
      required: [child, type, to_ou_code]
    Transfer:
      type: object
      properties:
        transfer_id:
          type: string
          format: uuid
          description: Replaces the AP06 Message_ID that stays the same across an exchange (AP06 L280).
        ypid:
          type: integer
        type:
          $ref: "#/components/schemas/TransferType"
        status:
          $ref: "#/components/schemas/TransferStatus"
        home:
          $ref: "#/components/schemas/Organisation"
        from:
          $ref: "#/components/schemas/Organisation"
        to:
          $ref: "#/components/schemas/Organisation"
        placement_request_id:
          type: string
          format: uuid
          nullable: true
        requested_at:
          type: string
          format: date-time
        requested_by:
          type: string
        decided_at:
          type: string
          format: date-time
          nullable: true
        decided_by:
          type: string
          nullable: true
        rejection:
          type: object
          allOf:
            - $ref: "#/components/schemas/Rejection"
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
        ending_outcome:
          type: string
          enum: [returned_to_home, complete_transfer_to_host]
          nullable: true
      required: [transfer_id, ypid, type, status, home, from, to, requested_at]
    Rejection:
      type: object
      properties:
        reason:
          type: string
          description: |
            A code from `GET /reference-data/transfer-rejection-reasons` (for transfers rejected by a YJS), `se-transfer-rejection-reasons` (for transfers rejected by a secure establishment; User 2026-11-24 grill Q8) or `update-rejection-reasons` (for reviews) (AP06 L336–347; SimpleTypes L1342–1353).
        description:
          type: string
          description: Free text. Required when `reason` is `other` (AP06 L345, L467).
      required: [reason]
    TransferUpdate:
      type: object
      description: Body of `PATCH /transfers/{transferid}` (User 2026-11-24 grill Q7).
      properties:
        status:
          type: string
          enum: [accepted, rejected, ended]
        rejection:
          allOf:
            - $ref: "#/components/schemas/Rejection"
          description: Required when `status` is `rejected`.
        ending_outcome:
          type: string
          enum: [returned_to_home, complete_transfer_to_host]
          description: Required when `status` is `ended`. `complete_transfer_to_host` is valid for YJS↔YJS only (AP02 L866 YY011).
      required: [status]

    StageStatus:
      $ref: "../swagger.yaml#/components/schemas/StageStatus"
    StageHistoryEvent:
      type: object
      properties:
        event:
          type: string
          enum: [created, saved, rebased, completed, shared, review_accepted, review_rejected, superseded, cancelled, attachment_added, attachment_removed]
        at:
          type: string
          format: date-time
        by:
          type: string
          description: The authenticated user who made the request (User 2026-11-23 Q14).
        signed_off_by:
          type: string
          nullable: true
          description: For `cancelled`, the second signatory from `X-Signoff-User` (Q14). For `completed`, see the countersignatures in the stage itself (Q15).
        organisation:
          $ref: "#/components/schemas/Organisation"
        reason:
          type: string
          nullable: true
          description: For `cancelled`, the reason code (Q13). For `review_rejected`, the rejection reason.
      required: [event, at, by, organisation]

    ReviewDecision:
      type: object
      properties:
        decision:
          type: string
          enum: [accept, reject]
        rejection:
          $ref: "#/components/schemas/Rejection"
      required: [decision]
    Review:
      type: object
      properties:
        review_id:
          type: string
          format: uuid
        stageid:
          type: string
          format: uuid
        reviewing_organisation:
          $ref: "#/components/schemas/Organisation"
        status:
          type: string
          enum: [pending, accepted, rejected]
        rejection:
          type: object
          allOf:
            - $ref: "#/components/schemas/Rejection"
          nullable: true
        decided_at:
          type: string
          format: date-time
          nullable: true
        decided_by:
          type: string
          nullable: true
    PendingReview:
      allOf:
        - $ref: "#/components/schemas/Review"
        - type: object
          properties:
            ypid:
              type: integer
            stage_type:
              type: string
            completed_by_organisation:
              $ref: "#/components/schemas/Organisation"
            completed_at:
              type: string
              format: date-time

    StageChanges:
      type: object
      properties:
        stageid:
          type: string
          format: uuid
        compared_with_stageid:
          type: string
          format: uuid
          nullable: true
        changes:
          type: array
          items:
            type: object
            properties:
              field_reference:
                type: string
                description: Data-dictionary field reference, e.g. `5.3.2` (AP06 L235).
              section:
                type: string
              previous_value: {}
              new_value: {}

    Attachment:
      type: object
      properties:
        attachment_id:
          type: string
          format: uuid
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
        section:
          type: string
          nullable: true
        uploaded_by:
          type: string
        uploaded_at:
          type: string
          format: date-time
        scan_status:
          type: string
          enum: [pending, clean, rejected]
          description: Malware scan result. Others can download the file only when `clean` (User 2026-11-23 Q44).

    PlacementRequestStatus:
      type: string
      enum: [requested, placed, rejected_by_establishment, withdrawn]
      x-speculative: true
      description: |
        `placed` means the Placement Service has decided and the platform has created a `caretaking` transfer to the chosen establishment. `rejected_by_establishment` means that establishment rejected the transfer, and the request is back with the Placement Service to choose again (User 2026-11-24 grill Q2). When it places the child again, the status returns to `placed` with the new establishment and transfer (User 2026-11-24 grill Q12).
    PlacementRequestCreate:
      type: object
      description: The `ypid` is in the path (User 2026-11-23 Q37).
      properties:
        child:
          $ref: "../swagger.yaml#/components/schemas/MinimalChild"
        stageid:
          type: string
          format: uuid
          description: The completed stage carrying the Custody module.
      required: [child, stageid]
    PlacementRequest:
      type: object
      properties:
        placement_request_id:
          type: string
          format: uuid
        ypid:
          type: integer
        stageid:
          type: string
          format: uuid
        requesting_yjs:
          $ref: "#/components/schemas/Organisation"
        status:
          $ref: "#/components/schemas/PlacementRequestStatus"
        placed_at:
          type: object
          allOf:
            - $ref: "#/components/schemas/Organisation"
          nullable: true
        transfer_id:
          type: string
          format: uuid
          nullable: true
          description: The `caretaking` transfer the platform created when the Placement Service decided. After a rejection and a new decision, this is the latest transfer.
        establishment_rejections:
          type: array
          description: Earlier transfers rejected by a secure establishment for this request, so the requesting YJS can see them (User 2026-11-24 grill Q2).
          items:
            type: object
            properties:
              transfer_id:
                type: string
                format: uuid
              establishment:
                $ref: "#/components/schemas/Organisation"
              rejection:
                $ref: "#/components/schemas/Rejection"
              rejected_at:
                type: string
                format: date-time

    DuplicateReportCreate:
      type: object
      properties:
        suspected_duplicate_ypid:
          type: integer
          minimum: 1
          maximum: 999999999
        reason:
          type: string
          description: A code from `GET /reference-data/duplicate-report-reasons`.
        note:
          type: string
      required: [suspected_duplicate_ypid, reason]
    DuplicateReport:
      allOf:
        - $ref: "#/components/schemas/DuplicateReportCreate"
        - type: object
          properties:
            report_id:
              type: string
              format: uuid
            ypid:
              type: integer
            status:
              type: string
              enum: [open, merged, not_duplicate]
            reported_by:
              type: string
            reported_at:
              type: string
              format: date-time
            surviving_ypid:
              type: integer
              nullable: true
              description: Once `merged`, the `ypid` that the other now redirects to (User 2026-11-23 Q26).

    ReferenceItem:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
        applies_to:
          type: array
          items:
            type: string
          description: e.g. which organisation types may create a stage type (AP02 L520 GE034), which case types allow a stage type (AP03 'Data Items CONSOLIDATED' row 4 cols AH–AL), or which rejection reasons apply to initial transfer only (AP06 L347).
